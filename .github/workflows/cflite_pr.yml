name: ClusterFuzzLite

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `address`, and not because JavaScript needs AddressSanitizer - it
        # does not, OSS-Fuzz says so plainly. The ClusterFuzzLite action
        # validates this value against ['address', 'memory', 'undefined',
        # 'coverage'] and rejects `none` outright:
        #   ERROR - Invalid SANITIZER: none.
        # Its own default is `address`, so that is what a JavaScript project
        # gets whether it says so or not. The docs and the runner disagree
        # here; the runner is the one that decides.
        sanitizer: [address]
    steps:
      - name: Build the fuzzer
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main, 2026-02-12
        with:
          language: javascript
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run it against the change
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main, 2026-02-12
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
